<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Race Tracker Tester</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f1117;
      color: #e2e8f0;
      font-family: ui-monospace, "Cascadia Code", monospace;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    h1 { font-size: 1.1rem; color: #94a3b8; letter-spacing: .05em; }
    h2 { font-size: .75rem; color: #64748b; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 12px; }

    .card {
      background: #1e293b;
      border-radius: 10px;
      padding: 16px;
    }

    /* ── GUID bar ── */
    #guid-bar {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #guid-bar label { font-size: .8rem; color: #64748b; white-space: nowrap; }

    #guid-input {
      flex: 1;
      background: #0f1117;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #e2e8f0;
      font-family: inherit;
      font-size: .85rem;
      padding: 6px 10px;
      outline: none;
    }

    #guid-input:focus { border-color: #60a5fa; }

    button {
      background: #1d4ed8;
      border: none;
      border-radius: 6px;
      color: #fff;
      cursor: pointer;
      font-family: inherit;
      font-size: .8rem;
      padding: 6px 14px;
      white-space: nowrap;
    }
    button:hover { background: #2563eb; }
    button:disabled { background: #334155; color: #64748b; cursor: default; }

    /* ── status bar ── */
    #status-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: .82rem;
      color: #64748b;
    }

    #state-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 9999px;
      font-size: .72rem;
      font-weight: 600;
      background: #1e293b;
      color: #94a3b8;
    }
    #state-badge.connected  { background: #1e3a5f; color: #60a5fa; }
    #state-badge.acquiring  { background: #14532d; color: #4ade80; }

    /* ── charts ── */
    .charts-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    canvas { width: 100% !important; }

    #no-data {
      grid-column: 1 / -1;
      text-align: center;
      padding: 48px;
      color: #475569;
      font-size: .85rem;
    }

    /* ── keepalive table ── */
    #keepalive-wrap {
      max-height: 180px;
      overflow-y: auto;
    }

    #keepalive-table {
      width: 100%;
      border-collapse: collapse;
      font-size: .78rem;
    }

    #keepalive-table thead th {
      color: #475569;
      font-weight: 400;
      text-align: left;
      padding: 0 12px 6px 0;
      border-bottom: 1px solid #334155;
      white-space: nowrap;
    }

    #keepalive-table tbody tr:hover { background: #263045; }

    #keepalive-table tbody td {
      color: #94a3b8;
      padding: 4px 12px 4px 0;
      border-bottom: 1px solid #1a2540;
      white-space: nowrap;
    }

    .ka-state.idle       { color: #64748b; }
    .ka-state.connected  { color: #60a5fa; }
    .ka-state.acquiring  { color: #4ade80; }

    #no-keepalive { color: #475569; font-size: .8rem; }

    /* ── commands ── */
    .cmd-card-inner {
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 24px;
    }

    .cmd-section { display: flex; flex-direction: column; gap: 16px; }

    .cmd-block { display: flex; flex-direction: column; gap: 8px; }

    .cmd-block h3 {
      font-size: .72rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    .cmd-fields {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: flex-end;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .field label { font-size: .7rem; color: #64748b; }

    .field input, .field select {
      background: #0f1117;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #e2e8f0;
      font-family: inherit;
      font-size: .82rem;
      padding: 5px 8px;
      width: 130px;
      outline: none;
    }
    .field input:focus, .field select:focus { border-color: #60a5fa; }

    .field select { width: 150px; }

    #cmd-result {
      font-size: .75rem;
      color: #4ade80;
      min-height: 1em;
    }
    #cmd-result.error { color: #f87171; }

    /* ── sent queue ── */
    .sent-queue { display: flex; flex-direction: column; gap: 4px; }

    #sent-list { display: flex; flex-direction: column; gap: 6px; max-height: 280px; overflow-y: auto; }

    .sent-queue h3 {
      font-size: .72rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: 4px;
    }

    .sent-entry {
      background: #0f1117;
      border-radius: 6px;
      padding: 5px 8px;
      font-size: .74rem;
      color: #64748b;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .sent-entry .sent-cmd { color: #94a3b8; font-weight: 600; }
    .sent-entry .sent-time { font-size: .68rem; color: #475569; }

    /* ── error badges ── */
    .err-ok { color: #4ade80; }
    .err-badges { display: inline-flex; flex-wrap: wrap; gap: 4px; }
    .err-badge {
      display: inline-block;
      background: #450a0a;
      color: #f87171;
      border-radius: 4px;
      font-size: .68rem;
      padding: 1px 6px;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <!-- GUID selector -->
  <div class="card" id="guid-bar">
    <label>Device GUID</label>
    <input id="guid-input" type="text" list="guid-list" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" spellcheck="false" autocomplete="off" />
    <datalist id="guid-list"></datalist>
    <button id="guid-btn" onclick="setGuid()">Connect</button>
    <button id="disconnect-btn" onclick="disconnectGuid()" style="background:#7f1d1d;" disabled>Disconnect</button>
    <div id="guid-status" style="font-size:.78rem;color:#64748b"></div>
  </div>

  <!-- Status -->
  <div id="status-bar">
    <span>Run <strong id="run-id">—</strong></span>
    <span><strong id="sample-count">0</strong> samples</span>
    <span id="progress-wrap" style="display:none">Acquiring <strong id="progress-val">—</strong></span>
    <span>Uptime <strong id="uptime">—</strong></span>
    <span>Err <strong id="err-code">—</strong></span>
    <span id="state-badge">idle</span>
    <button id="reset-btn" onclick="resetData()" style="margin-left:auto;background:#7f1d1d;">Reset</button>
  </div>

  <!-- Charts -->
  <div class="charts-grid" id="charts">
    <div id="no-data">Connect to a device to see data.</div>
  </div>

  <!-- Keepalive log -->
  <div class="card">
    <h2>Keepalive</h2>
    <div id="keepalive-wrap">
      <table id="keepalive-table">
        <thead>
          <tr>
            <th>Uptime</th>
            <th>State</th>
            <th>Battery</th>
            <th>Sampled</th>
            <th>Error</th>
          </tr>
        </thead>
        <tbody id="keepalive-body">
          <tr><td colspan="5" id="no-keepalive">No keepalives yet.</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Commands -->
  <div class="card">
    <h2>Commands</h2>
    <div class="cmd-card-inner">
      <div class="cmd-section">

        <div class="cmd-block">
          <h3>Connect (0x01)</h3>
          <div class="cmd-fields">
            <button onclick="sendConnect()">Send</button>
          </div>
        </div>

        <div class="cmd-block">
          <h3>Disconnect (0x03)</h3>
          <div class="cmd-fields">
            <button onclick="sendDisconnect()" style="background:#7f1d1d;">Send</button>
          </div>
        </div>

        <div class="cmd-block">
          <h3>Reset (0x04)</h3>
          <div class="cmd-fields">
            <button onclick="sendReset()" style="background:#78350f;">Send</button>
          </div>
        </div>

        <div class="cmd-block">
          <h3>Start Run (0x02)</h3>
          <div class="cmd-fields">
            <div class="field">
              <label>Run ID (GUID)</label>
              <div style="display:flex;gap:6px;align-items:center">
                <input id="f-run-id" type="text" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" spellcheck="false" style="width:320px" />
                <button type="button" onclick="document.getElementById('f-run-id').value = crypto.randomUUID()" style="background:#1e3a5f;padding:5px 10px;font-size:.75rem">⟳</button>
              </div>
            </div>
            <div class="field">
              <label>Num Samples</label>
              <input id="f-num-samples" type="number" value="1000" min="1" />
            </div>
            <div class="field">
              <label>ODR</label>
              <select id="f-odr">
                <option value="1">12.5 Hz</option>
                <option value="2">26 Hz</option>
                <option value="3">52 Hz</option>
                <option value="4" selected>104 Hz</option>
                <option value="5">208 Hz</option>
                <option value="6">417 Hz</option>
                <option value="7">833 Hz</option>
              </select>
            </div>
            <div class="field">
              <label>Accel Range</label>
              <select id="f-accel">
                <option value="0" selected>±2 g</option>
                <option value="2">±4 g</option>
                <option value="3">±8 g</option>
                <option value="1">±16 g</option>
              </select>
            </div>
            <div class="field">
              <label>Gyro Range</label>
              <select id="f-gyro">
                <option value="1">±125 dps</option>
                <option value="0" selected>±250 dps</option>
                <option value="2">±500 dps</option>
                <option value="4">±1000 dps</option>
                <option value="6">±2000 dps</option>
              </select>
            </div>
            <button onclick="sendStartRun()">Send</button>
          </div>
        </div>

        <div id="cmd-result"></div>
      </div>

      <!-- Sent queue -->
      <div class="sent-queue">
        <h3>Sent</h3>
        <div id="sent-list"></div>
      </div>
    </div>
  </div>

  <script>
    const POLL_MS   = 2000;
    const MAX_SENT  = 8;
    const sentQueue = [];

    function fmtErrNames(names, rawHex) {
      if (!names || !names.length) return '<span class="err-ok">OK</span>';
      const title = "0x" + rawHex.toString(16);
      return '<span class="err-badges" title="' + title + '">' +
        names.map(n => '<span class="err-badge">' + n + '</span>').join("") +
        '</span>';
    }

    function fmtUptime(ms) {
      if (!ms) return "—";
      const s = Math.floor(ms / 1000);
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = s % 60;
      if (h > 0) return `${h}h ${String(m).padStart(2,"0")}m ${String(sec).padStart(2,"0")}s`;
      if (m > 0) return `${m}m ${String(sec).padStart(2,"0")}s`;
      return `${sec}.${String(Math.floor((ms % 1000) / 100))}s`;
    }

    const ACCEL_COLORS = { ax: "#f87171", ay: "#4ade80", az: "#60a5fa" };
    const GYRO_COLORS  = { gx: "#fb923c", gy: "#a78bfa", gz: "#34d399" };

    let accelChart = null;
    let gyroChart  = null;

    // ── GUID ──────────────────────────────────────────────────────────────────

    async function setGuid() {
      const guid = document.getElementById("guid-input").value.trim();
      if (!guid) return;
      const res  = await fetch("/api/set-guid", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ guid }) });
      const json = await res.json();
      const el   = document.getElementById("guid-status");
      if (json.ok) {
        el.textContent = "subscribed";
        el.style.color = "#4ade80";
        document.getElementById("disconnect-btn").disabled = false;
        accelChart = gyroChart = null;
        document.getElementById("charts").innerHTML = '<div id="no-data">Waiting for data…</div>';
      } else {
        el.textContent = json.error;
        el.style.color = "#f87171";
      }
    }

    async function disconnectGuid() {
      await fetch("/api/disconnect-guid", { method: "POST" });
      document.getElementById("guid-input").value        = "";
      document.getElementById("guid-status").textContent = "";
      document.getElementById("disconnect-btn").disabled = true;
      accelChart = gyroChart = null;
      document.getElementById("charts").innerHTML = '<div id="no-data">Connect to a device to see data.</div>';
      document.getElementById("run-id").textContent       = "—";
      document.getElementById("sample-count").textContent = "0";
      document.getElementById("uptime").textContent       = "—";
      document.getElementById("err-code").innerHTML        = "—";
      document.getElementById("progress-wrap").style.display = "none";
      const badge = document.getElementById("state-badge");
      badge.textContent = "idle"; badge.className = "";
      updateKeepaliveLog([]);
    }

    document.getElementById("guid-input").addEventListener("keydown", e => { if (e.key === "Enter") setGuid(); });

    // ── Charts ────────────────────────────────────────────────────────────────

    function makeChart(canvasId, label, colorMap) {
      const ctx = document.getElementById(canvasId).getContext("2d");
      return new Chart(ctx, {
        type: "line",
        data: {
          labels: [],
          datasets: Object.entries(colorMap).map(([key, color]) => ({
            label: key, data: [], borderColor: color,
            backgroundColor: color + "22", borderWidth: 1.5, pointRadius: 0, tension: 0.3,
          })),
        },
        options: {
          animation: false, responsive: true,
          interaction: { mode: "index", intersect: false },
          plugins: { legend: { labels: { color: "#94a3b8", boxWidth: 12, font: { size: 11 } } } },
          scales: {
            x: { ticks: { color: "#475569", maxTicksLimit: 10, font: { size: 10 } }, grid: { color: "#1e293b" },
                 title: { display: true, text: "sample", color: "#475569", font: { size: 10 } } },
            y: { ticks: { color: "#475569", font: { size: 10 } }, grid: { color: "#334155" },
                 title: { display: true, text: label, color: "#475569", font: { size: 10 } } },
          },
        },
      });
    }

    function ensureCharts() {
      if (accelChart) return;
      document.getElementById("charts").innerHTML = `
        <div class="card"><h2>Accelerometer (m/s²)</h2><canvas id="accel-canvas"></canvas></div>
        <div class="card"><h2>Gyroscope (rad/s)</h2><canvas id="gyro-canvas"></canvas></div>`;
      accelChart = makeChart("accel-canvas", "m/s²", ACCEL_COLORS);
      gyroChart  = makeChart("gyro-canvas",  "rad/s", GYRO_COLORS);
    }

    function updateCharts(records) {
      ensureCharts();
      const valid  = records.filter(Boolean);
      const labels = valid.map((_, i) => i);
      accelChart.data.labels = gyroChart.data.labels = labels;
      ["ax","ay","az","gx","gy","gz"].forEach((key, di) => {
        const chart = di < 3 ? accelChart : gyroChart;
        chart.data.datasets[di < 3 ? di : di - 3].data = valid.map(r => r[key]);
      });
      accelChart.update("none");
      gyroChart.update("none");
    }

    // ── Keepalive log ─────────────────────────────────────────────────────────

    function updateKeepaliveLog(entries) {
      const tbody = document.getElementById("keepalive-body");
      if (!entries.length) {
        tbody.innerHTML = '<tr><td colspan="5" id="no-keepalive">No keepalives yet.</td></tr>';
        return;
      }
      tbody.innerHTML = [...entries].reverse().map(e => `
        <tr>
          <td>${fmtUptime(e.uptimeMs)}</td>
          <td><span class="ka-state ${e.state}">${e.state}</span></td>
          <td>${e.batteryMv} mV &nbsp; ${e.batteryPct === 255 ? "—" : e.batteryPct + "%"}</td>
          <td>${e.totalSamples ? e.sampledCount + " / " + e.totalSamples : "—"}</td>
          <td>${fmtErrNames(e.errorNames, e.errorCode)}</td>
        </tr>`).join("");
    }

    // ── Poll ──────────────────────────────────────────────────────────────────

    async function poll() {
      try {
        const res  = await fetch("/api/data");
        const json = await res.json();
        const { run, status, keepalives, guid } = json;

        if (guid && document.getElementById("guid-input").value === "") {
          document.getElementById("guid-input").value = guid;
        }

        document.getElementById("run-id").textContent       = run.runId ?? "—";
        document.getElementById("sample-count").textContent = run.records.filter(Boolean).length;
        document.getElementById("uptime").textContent       = fmtUptime(status.uptimeMs);

        const errEl = document.getElementById("err-code");
        errEl.innerHTML = fmtErrNames(status.errorNames, status.errorCode);

        // Live acquisition progress — the status message carries sampledCount/totalSamples
        // during a run (the device sends ~10 of these), well before the end-of-run data batches.
        const progWrap = document.getElementById("progress-wrap");
        if (status.state === "acquiring" && status.totalSamples) {
          progWrap.style.display = "";
          document.getElementById("progress-val").textContent = status.sampledCount + " / " + status.totalSamples;
        } else {
          progWrap.style.display = "none";
        }

        const badge = document.getElementById("state-badge");
        badge.textContent = status.state;
        badge.className   = status.state;

        if (run.records.length > 0) updateCharts(run.records);
        updateKeepaliveLog(keepalives);

        const gr   = await fetch("/api/guids");
        const gj   = await gr.json();
        const dl   = document.getElementById("guid-list");
        dl.innerHTML = gj.guids.map(g => `<option value="${g}">`).join("");
      } catch (e) {
        console.warn("poll error", e);
      }
    }

    // ── Commands ──────────────────────────────────────────────────────────────

    function showCmdResult(msg, isError = false) {
      const el = document.getElementById("cmd-result");
      el.textContent = msg;
      el.className   = isError ? "error" : "";
      setTimeout(() => { el.textContent = ""; el.className = ""; }, 3000);
    }

    function pushSentQueue(body, ok) {
      const time = new Date().toLocaleTimeString();
      sentQueue.unshift({ cmd: body.cmd, detail: body.runId ?? "", time, ok });
      if (sentQueue.length > MAX_SENT) sentQueue.pop();
      const el = document.getElementById("sent-list");
      el.innerHTML = sentQueue.map(e => `
        <div class="sent-entry">
          <span class="sent-cmd" style="color:${e.ok ? "#94a3b8" : "#f87171"}">${e.cmd}</span>
          ${e.detail ? `<span style="color:#475569;font-size:.68rem;overflow:hidden;text-overflow:ellipsis">${e.detail}</span>` : ""}
          <span class="sent-time">${e.time}</span>
        </div>`).join("");
    }

    async function postCmd(body) {
      try {
        const res  = await fetch("/api/send-cmd", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
        const json = await res.json();
        if (json.ok) { showCmdResult("sent: " + body.cmd); pushSentQueue(body, true); }
        else { showCmdResult(json.error, true); pushSentQueue(body, false); }
      } catch (e) {
        showCmdResult("request failed", true);
        pushSentQueue(body, false);
      }
    }

    async function resetData() {
      await fetch("/api/reset", { method: "POST" });
      accelChart = gyroChart = null;
      document.getElementById("charts").innerHTML = '<div id="no-data">Waiting for data…</div>';
      document.getElementById("run-id").textContent       = "—";
      document.getElementById("sample-count").textContent = "0";
      document.getElementById("uptime").textContent       = "—";
      document.getElementById("err-code").innerHTML        = "—";
      document.getElementById("progress-wrap").style.display = "none";
      const badge = document.getElementById("state-badge");
      badge.textContent = "idle"; badge.className = "idle";
      updateKeepaliveLog([]);
      sentQueue.length = 0;
      document.getElementById("sent-list").innerHTML = "";
    }

    function sendConnect()    { postCmd({ cmd: "connect" }); }
    function sendDisconnect() { postCmd({ cmd: "disconnect" }); }
    function sendReset() {
      postCmd({ cmd: "reset" });
      sentQueue.length = 0;
      document.getElementById("sent-list").innerHTML = "";
    }

    function sendStartRun() {
      postCmd({
        cmd:        "start_run",
        runId:      document.getElementById("f-run-id").value.trim(),
        numSamples: parseInt(document.getElementById("f-num-samples").value),
        odr:        parseInt(document.getElementById("f-odr").value),
        accelRange: parseInt(document.getElementById("f-accel").value),
        gyroRange:  parseInt(document.getElementById("f-gyro").value),
      });
    }

    poll();
    setInterval(poll, POLL_MS);
  </script>
</body>
</html>
