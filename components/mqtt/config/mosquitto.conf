# MQTT listener
listener 1883
protocol mqtt

# WebSocket listener (useful for browser-based debugging tools)
listener 9001
protocol websockets

# Auth — set to false and uncomment password_file for production
allow_anonymous true
# password_file /mosquitto/config/passwd

# Persistence — survives broker restarts
persistence true
persistence_location /mosquitto/data/
max_queued_messages 100

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
