profiles:
  profile-race-tracker:
    fqbn: esp32:esp32:adafruit_feather_esp32_v2:UploadSpeed=921600,CPUFreq=240,FlashFreq=80,FlashSize=8M,PartitionScheme=default_8MB,DebugLevel=none,PSRAM=enabled,LoopCore=1,EventsCore=1,EraseFlash=none,ZigbeeMode=default
    platforms:
      - platform: esp32:esp32 (3.3.8)
        platform_index_url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_dev_index.json
    programmer: ""
    port_config:
      baudrate: "115200"
      lineEnding: "\r\n"
      bits: "8"
      parity: none
      stop_bits: "1"
    port: /dev/ttyACM0
    libraries:
      - STM32duino LSM6DSOX (2.3.4)
default_profile: profile-race-tracker
