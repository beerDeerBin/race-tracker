services:
  realtime:
    build:
      # Repo root so the Dockerfile can copy the hierarchical root build files
      # (global.json, Directory.*.props, nuget.config) and the building-blocks project.
      context: ../..
      dockerfile: components/realtime/src/RaceTracker.Realtime.Api/Dockerfile
    container_name: race-tracker-realtime
    depends_on:
      - rabbitmq
      - redis
    ports:
      - "8084:8080"   # health endpoints: http://localhost:8084/health/{live,ready}; hub: /hubs/telemetry
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # In-network dependency hostnames (override the appsettings defaults if needed).
      Realtime__RabbitMq__Host: rabbitmq
      Realtime__Redis__Host: redis
    restart: unless-stopped
